<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>学术晋升消消乐</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <section class="play-area" aria-label="学术晋升消消乐">
      <header class="topbar">
        <div>
          <p class="eyebrow">Academic Merge</p>
          <h1>学术晋升消消乐</h1>
        </div>
        <button class="restart-button" id="restartBtn" type="button">重新开始</button>
      </header>

      <div class="board-wrap">
        <div class="board" id="board" aria-label="7乘7棋盘">
          <div class="cell-layer" id="cellLayer" aria-hidden="true"></div>
          <div class="tile-layer" id="tileLayer"></div>
          <div class="end-effect hidden" id="endEffect" aria-hidden="true"></div>
        </div>
      </div>
    </section>

    <aside class="side-panel" aria-label="游戏信息">
      <section class="stats-grid" aria-label="统计">
        <div class="stat">
          <span>步数</span>
          <strong id="movesValue">0</strong>
        </div>
        <div class="stat">
          <span>积分</span>
          <strong id="scoreValue">0</strong>
        </div>
        <div class="stat">
          <span>玩家</span>
          <strong id="highestValue">硕士</strong>
        </div>
      </section>

      <section class="message-box" aria-live="polite">
        <p id="statusText">输入姓名后开始。</p>
      </section>

      <section>
        <h2>等级</h2>
        <div class="legend" id="legend"></div>
      </section>
    </aside>
  </main>

  <div class="start-screen" id="startScreen">
    <form class="start-dialog" id="startForm">
      <p class="eyebrow">7 x 7</p>
      <h2>学术晋升消消乐</h2>
      <label for="playerNameInput">玩家姓名</label>
      <input id="playerNameInput" name="playerName" maxlength="8" autocomplete="name" placeholder="请输入姓名">
      <button type="submit">开始游戏</button>
    </form>
  </div>

  <script src="game.js" defer></script>
</body>
</html>
